upstream frontend {
    server frontend:3000;
}

upstream api {
    server tts-api:8000;
}

upstream livekit_signal {
    server livekit:7880;
}

server {
    listen 80;
    server_name localhost;

    # -----------------------------------------------------------------------
    # /  →  Frontend (voice client UI)
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # /api/  →  FastAPI (REST API + token endpoint)
    # -----------------------------------------------------------------------
    location /api/ {
        # Strip the /api prefix before forwarding
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (for /tts/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # /livekit/  →  LiveKit signal server (WebSocket)
    # -----------------------------------------------------------------------
    location /livekit/ {
        rewrite ^/livekit/(.*) /$1 break;
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -----------------------------------------------------------------------
    # Health check for the proxy itself
    # -----------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
