version: "3.8"

services:
  tts-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Use a named volume for models so they persist after download
      - model_data:/app/models
      # Mount local runners if you have them, otherwise they'll be downloaded
      - ./runners:/app/runners
    environment:
      - MODEL_DIR=/app/models
      - RUNNER_PATH=/app/runners/llama-liquid-audio-cli
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  model_data:
